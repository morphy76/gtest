# yaml-language-server: $schema=https://raw.githubusercontent.com/morphy76/vuhive/main/schemas/vuhive.schema.json
version: "1.0"
default_scenario: user_journey_with_think_time

scenarios:
  user_journey_with_think_time:
    type: constant_vus
    vus: 3
    ramp_up: 50ms
    run_period: 300ms
    ramp_down: 200ms
    vu_timeout: 2s

    # Declarative thinking time strategy evaluated by ctx.Sleep() when called with no arguments.
    # Supported types: "range" (uniform random), "fixed", "expo" (exponential), "gaussian" (normal).
    interaction_delay:
      type: range
      min: 20ms
      max: 60ms

    thresholds:
      - metric: catalog_view_duration
        stat: p95
        operator: "<"
        target: "100ms"
      - metric: add_to_cart_duration
        stat: p95
        operator: "<"
        target: "100ms"
      - metric: checkout_duration
        stat: p95
        operator: "<"
        target: "100ms"
      - metric: user_flow_success_rate
        stat: rate
        operator: ">="
        target: "0.95"
