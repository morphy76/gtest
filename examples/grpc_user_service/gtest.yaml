version: "1.0"
default_scenario: grpc_user_service_flow

scenarios:
  grpc_user_service_flow:
    type: arrival_rate
    target_tps: 20
    max_vus: 10
    ramp_up: 100ms
    run_period: 500ms
    ramp_down: 100ms
    vu_timeout: 1s
    params:
      service_name: "UserService"
      method: "GetUser"
    thresholds:
      - metric: grpc_latency
        stat: p95
        operator: "<"
        target: "100ms"
      - metric: rpc_success_rate
        stat: rate
        operator: ">="
        target: "0.95"
