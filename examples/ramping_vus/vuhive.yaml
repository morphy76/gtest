# yaml-language-server: $schema=https://raw.githubusercontent.com/morphy76/vuhive/main/schemas/vuhive.schema.json
version: "1.0"
default_scenario: spike_test

scenarios:
  spike_test:
    # Dynamic multi-stage pacing engine allowing stage-based ramps, holds, and spikes over time
    type: ramping_vus
    stages:
      - target: 5
        duration: 200ms   # Stage 1: Ramp up from 0 to 5 VUs over 200ms
      - target: 5
        duration: 300ms   # Stage 2: Hold steady at 5 VUs for 300ms
      - target: 15
        duration: 200ms   # Stage 3: Spike load up to 15 VUs over 200ms
      - target: 15
        duration: 300ms   # Stage 4: Hold peak spike load for 300ms
      - target: 0
        duration: 200ms   # Stage 5: Ramp down cleanly to 0 VUs
    ramp_down: 100ms      # Grace period allowing remaining active workers to finish
    vu_timeout: 1s

    thresholds:
      - metric: api_response_time
        stat: p95
        operator: "<"
        target: "50ms"
      - metric: api_success_rate
        stat: rate
        operator: ">="
        target: "0.99"
