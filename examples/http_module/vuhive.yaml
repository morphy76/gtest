# yaml-language-server: $schema=https://raw.githubusercontent.com/morphy76/vuhive/main/schemas/vuhive.schema.json
version: "1.0"

default_scenario: http_module_demo

scenarios:
  http_module_demo:
    type: constant_vus
    vus: 10
    ramp_up: 2s
    run_period: 10s
    ramp_down: 2s
    vu_timeout: 5s

    http:
      base_url: "http://localhost:8080"
      timeout: 5s
      headers:
        Accept: "application/json"
        User-Agent: "vuhive/1.0"
      pool:
        max_idle_conns: 100
        max_idle_conns_per_host: 10
        idle_conn_timeout: 90s
      detailed_timing: false
      metric_prefix: "vuhive.http."

    params:
      checkout_path: "/checkout"

    thresholds:
      - metric: vuhive.http.req_duration
        stat: p95
        operator: "<"
        target: "200ms"
      - metric: vuhive.http.req_failed
        stat: rate
        operator: "<="
        target: "0.01"

