# yaml-language-server: $schema=https://raw.githubusercontent.com/morphy76/vuhive/main/schemas/vuhive.schema.json
version: "1.0"
default_scenario: sla_quality_gates

scenarios:
  sla_quality_gates:
    type: constant_vus
    vus: 5
    ramp_up: 50ms
    run_period: 350ms
    ramp_down: 100ms
    vu_timeout: 1s

    thresholds:
      # Latency percentile SLA quality gates
      - metric: order_placement_latency
        stat: p95
        operator: "<"
        target: "100ms"
      - metric: order_placement_latency
        stat: p99
        operator: "<"
        target: "200ms"
      - metric: payment_auth_latency
        stat: p95
        operator: "<"
        target: "100ms"

      # Success rate quality gates
      - metric: order_success_rate
        stat: rate
        operator: ">="
        target: "0.95"
      - metric: payment_success_rate
        stat: rate
        operator: ">="
        target: "0.95"

      # Error and check quality gates with real-time early abort
      - metric: api_errors_total
        stat: count
        operator: "<="
        target: "0"
        abort_on_fail: true       # Immediately terminate execution if errors occur
        delay_abort_eval: 100ms   # Grace period before abort evaluation begins
      - metric: vuhive.checks.failed
        stat: count
        operator: "<="
        target: "0"
